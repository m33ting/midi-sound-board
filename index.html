<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>MIDI Input Soundboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 20px;
  }

  #upload {
    margin-bottom: 20px;
  }

  #status {
    margin-bottom: 10px;
    color: #ccc;
  }

  #channel-select {
    margin: 10px;
    padding: 8px;
    font-size: 16px;
  }

  .pad-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }

  .pad {
    background: #333;
    padding: 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .pad.active {
    background: #ff9800;
    transform: scale(1.08);
  }

  .pad::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
    background: rgba(255, 152, 0, 0.4);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
  }

  .pad.pulse::after {
    animation: pulse 0.5s ease-out;
  }

  @keyframes pulse {
    0% { width: 0; height: 0; opacity: 0.7; }
    100% { width: 200px; height: 200px; opacity: 0; }
  }
</style>
</head>
<body>

<h1>MIDI Input Soundboard</h1>

<div id="status">Connecting to MIDI…</div>

<label for="channel-select">Listen on MIDI Channel:</label>
<select id="channel-select">
  <option value="0">Channel 1</option>
  <option value="1">Channel 2</option>
  <option value="2">Channel 3</option>
  <option value="3">Channel 4</option>
  <option value="4">Channel 5</option>
  <option value="5">Channel 6</option>
  <option value="6">Channel 7</option>
  <option value="7">Channel 8</option>
  <option value="8">Channel 9</option>
  <option value="9">Channel 10</option>
  <option value="10">Channel 11</option>
  <option value="11">Channel 12</option>
  <option value="12">Channel 13</option>
  <option value="13">Channel 14</option>
  <option value="14">Channel 15</option>
  <option value="15">Channel 16</option>
</select>

<input id="upload" type="file" accept="audio/*" multiple>

<div class="pad-grid" id="pads"></div>

<script>
  let midiAccess = null;
  let midiInput = null;

  const channelSelect = document.getElementById("channel-select");
  const upload = document.getElementById("upload");
  const pads = document.getElementById("pads");

  let padData = []; // store audio + element + midi note

  // MIDI INIT
  if (navigator.requestMIDIAccess) {
    navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
  } else {
    document.getElementById("status").textContent =
      "Web MIDI not supported in this browser.";
  }

  function onMIDISuccess(access) {
    midiAccess = access;
    const inputs = Array.from(access.inputs.values());
    if (inputs.length > 0) {
      midiInput = inputs[0];
      midiInput.onmidimessage = onMIDIMessage;
      document.getElementById("status").textContent =
        "Listening to MIDI input: " + midiInput.name;
    } else {
      document.getElementById("status").textContent =
        "No MIDI input found.";
    }
  }

  function onMIDIFailure() {
    document.getElementById("status").textContent =
      "Failed to access MIDI.";
  }

  // Handle incoming MIDI
  function onMIDIMessage(msg) {
    const [status, note, velocity] = msg.data;
    const channel = status & 0x0F;
    const type = status & 0xF0;

    const selectedChannel = parseInt(channelSelect.value);

    // Only respond to Note On on selected channel
    if (channel === selectedChannel && type === 0x90 && velocity > 0) {
      triggerPadByNote(note);
    }
  }

  function triggerPadByNote(note) {
    const padObj = padData.find(p => p.midiNote === note);
    if (!padObj) return;

    const { audio, element } = padObj;

    audio.currentTime = 0;
    audio.play();

    element.classList.add("active", "pulse");
    setTimeout(() => element.classList.remove("active"), 150);
    setTimeout(() => element.classList.remove("pulse"), 500);
  }

  // AUDIO + PADS
  upload.addEventListener("change", function () {
    pads.innerHTML = "";
    padData = [];

    Array.from(upload.files).forEach((file, index) => {
      const pad = document.createElement("div");
      pad.className = "pad";
      pad.textContent = file.name;

      const audio = new Audio(URL.createObjectURL(file));

      const midiNote = 60 + index; // C4 upward

      pad.addEventListener("click", () => triggerPadByNote(midiNote));

      pads.appendChild(pad);

      padData.push({
        midiNote,
        audio,
        element: pad
      });
    });
  });
</script>

</body>
</html>
