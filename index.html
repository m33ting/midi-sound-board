<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Uploadable Soundboard</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    text-align: center;
    padding: 20px;
  }
  #upload {
    margin-bottom: 20px;
  }
  .pad-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }
  .pad {
    background: #333;
    padding: 20px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.15s;
  }
  .pad:hover {
    background: #555;
  }
</style>
</head>
<body>

<h1>Soundboard – Upload Your Own Songs</h1>

<input id="upload" type="file" accept="audio/*" multiple>

<div class="pad-grid" id="pads"></div>

<script>
  const upload = document.getElementById("upload");
  const pads = document.getElementById("pads");

  upload.addEventListener("change", function () {
    pads.innerHTML = ""; // Clear old pads

    Array.from(upload.files).forEach((file, index) => {
      const pad = document.createElement("div");
      pad.className = "pad";
      pad.textContent = file.name;

      const audio = new Audio(URL.createObjectURL(file));

      pad.addEventListener("click", () => {
        audio.currentTime = 0;
        audio.play();
      });

      pads.appendChild(pad);
    });
  });
</script>

</body>
</html>
